name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulator:
    name: Simulator (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: machineiq
          POSTGRES_USER: machineiq
          POSTGRES_PASSWORD: machineiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U machineiq"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/machineiq
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  frontend:
    name: Dashboard (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    needs: [simulator, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack
        run: docker compose up -d --build
      - name: Run end-to-end checks
        run: ./scripts/e2e.sh
      - name: Let some history build up, then trigger a few problems for the screenshots
        run: |
          sleep 40
          curl -fsS -X POST localhost:3000/api/demo/inject/SRT-02/vibration
          curl -fsS -X POST localhost:3000/api/demo/inject/LBL-03/overheat
          sleep 30
      - name: Capture dashboard screenshots
        run: |
          mkdir -p screenshots
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node scripts/screenshot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --tail=200
