name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulator:
    name: Simulator (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q

  backend:
    name: Backend (Java)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: machineiq
          POSTGRES_USER: machineiq
          POSTGRES_PASSWORD: machineiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U machineiq"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/machineiq
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
